name: Build Equalizer APO VST3 Installer

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: manual-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer-x64:
    name: Build x64 installer
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build installer
        shell: pwsh
        run: |
          .\scripts\build-installer-x64.ps1 `
            -Configuration "${{ inputs.configuration }}" `
            -VisualStudioEdition "Enterprise"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EqualizerAPO-x64-${{ inputs.configuration }}-installer
          path: Setup/*.exe
          if-no-files-found: error
          retention-days: 14
